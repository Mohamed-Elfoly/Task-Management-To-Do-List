<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300&f[]=chillax@600,500,300,700,400,200&display=swap"
    rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

  <link rel="shortcut icon" href="icon.png" type="image/x-icon">
  <link rel="stylesheet" href="style.css" />


  <title>TAADAA</title>
</head>

<body>
  <!-- Wrapper div to contain the entire content -->
  <div class="wrapper">
    <h1>TaaDaa</h1>

    <!-- Input box for adding tasks -->
    <div class="input-box">
      <input type="text" placeholder="Enter your task title" id="task-title" />
      <textarea name="description" id="task-description" placeholder="Enter your task description"></textarea>
      <button id="submit-btn" onclick="addTask()">ADD <i class="fa-solid fa-plus"></i></button>
      <button id="edit-btn" class="d-none">Save Changes</button>
    </div>

    <!-- List container to hold the tasks -->
    <div class="list-container">
      <h3>Tasks</h3>
      <ul class="p-0" id="task-container">
      </ul>

      <h3 id="completed-header" class="d-none">Completed</h3>
      <ul class="p-0" id="completed-container">
      </ul>
    </div>
  </div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>

  <script src="script.js"></script>
</body>

</html>
